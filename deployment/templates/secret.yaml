apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
  labels:
    {{- include "deer-flow.labels" . | nindent 4 }}
type: Opaque
stringData:
  ECC_API_KEY: {{ required "secret.eccApiKey is required" .Values.secret.eccApiKey | quote }}
  DATABASE_URL: {{ required "secret.databaseUrl is required" .Values.secret.databaseUrl | quote }}
  DEER_FLOW_CHECKPOINTER_DATABASE_URL: {{ required "secret.checkpointerDatabaseUrl is required" .Values.secret.checkpointerDatabaseUrl | quote }}
  DEER_FLOW_DB_SCHEMA: {{ .Values.secret.dbSchema | quote }}
  KEYCLOAK_URL: {{ required "secret.keycloakUrl is required" .Values.secret.keycloakUrl | quote }}
  KEYCLOAK_REALM: {{ required "secret.keycloakRealm is required" .Values.secret.keycloakRealm | quote }}
  KEYCLOAK_CLIENT_ID: {{ required "secret.keycloakClientId is required" .Values.secret.keycloakClientId | quote }}
  KEYCLOAK_CLIENT_SECRET: {{ required "secret.keycloakClientSecret is required" .Values.secret.keycloakClientSecret | quote }}
  SESSION_SECRET_KEY: {{ required "secret.sessionSecretKey is required" .Values.secret.sessionSecretKey | quote }}
  BETTER_AUTH_SECRET: {{ required "secret.betterAuthSecret is required" .Values.secret.betterAuthSecret | quote }}
  ALIYUN_OSS_ENDPOINT: {{ required "secret.aliyunOssEndpoint is required" .Values.secret.aliyunOssEndpoint | quote }}
  ALIYUN_OSS_BUCKET: {{ required "secret.aliyunOssBucket is required" .Values.secret.aliyunOssBucket | quote }}
  ALIYUN_OSS_ACCESS_KEY_ID: {{ required "secret.aliyunOssAccessKeyId is required" .Values.secret.aliyunOssAccessKeyId | quote }}
  ALIYUN_OSS_ACCESS_KEY_SECRET: {{ required "secret.aliyunOssAccessKeySecret is required" .Values.secret.aliyunOssAccessKeySecret | quote }}
  ALIYUN_OSS_SIGNED_URL_EXPIRES_SECONDS: {{ .Values.secret.aliyunOssSignedUrlExpiresSeconds | quote }}
  ALIYUN_IQS_API_KEY: {{ required "secret.aliyunIqsApiKey is required" .Values.secret.aliyunIqsApiKey | quote }}
  KEYCLOAK_TLS_INSECURE: {{ .Values.secret.keycloakTlsInsecure | default "false" | quote }}
