{{- if .Values.acrRegistry }}
apiVersion: v1
kind: Secret
metadata:
  name: acr-registry-secret
  labels:
    {{- include "ecc-yanhuang.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"auth\":\"%s\"}}}" .Values.acrRegistry.external (printf "%s:%s" .Values.acrRegistry.username .Values.acrRegistry.password | b64enc) | b64enc }}
{{- end }}
