apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-langgraph
  labels:
    {{- include "ecc-yanhuang.labels" . | nindent 4 }}
    app.kubernetes.io/component: langgraph
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: {{ .Values.langgraph.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ecc-yanhuang.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: langgraph
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ecc-yanhuang.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: langgraph
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- include "ecc-yanhuang.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: langgraph
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "cd backend && PYTHONPATH=. uv run langgraph dev --host 0.0.0.0 --port 2024"]
          ports:
            - name: http
              containerPort: 2024
              protocol: TCP
          env:
            - name: HOME
              value: /tmp
            - name: PORT
              value: "2024"
            - name: DEER_FLOW_HOME
              value: /app/backend/.deer-flow
            - name: DEER_FLOW_CONFIG_PATH
              value: /app/backend/config.yaml
            - name: DEER_FLOW_EXTENSIONS_CONFIG_PATH
              value: /app/backend/extensions_config.json
            {{- if .Values.secret.keycloakTlsInsecure }}
            - name: KEYCLOAK_TLS_INSECURE
              value: {{ .Values.secret.keycloakTlsInsecure | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: DATABASE_URL
            - name: DEER_FLOW_CHECKPOINTER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: DEER_FLOW_CHECKPOINTER_DATABASE_URL
            - name: DEER_FLOW_DB_SCHEMA
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: DEER_FLOW_DB_SCHEMA
            - name: KEYCLOAK_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: KEYCLOAK_URL
            - name: KEYCLOAK_REALM
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: KEYCLOAK_REALM
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: KEYCLOAK_CLIENT_ID
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: KEYCLOAK_CLIENT_SECRET
            - name: SESSION_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: SESSION_SECRET_KEY
            - name: ALIYUN_OSS_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: ALIYUN_OSS_ENDPOINT
            - name: ALIYUN_OSS_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: ALIYUN_OSS_BUCKET
            - name: ALIYUN_OSS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: ALIYUN_OSS_ACCESS_KEY_ID
            - name: ALIYUN_OSS_ACCESS_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: ALIYUN_OSS_ACCESS_KEY_SECRET
            - name: ALIYUN_IQS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: ALIYUN_IQS_API_KEY
            - name: ECC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: ECC_API_KEY
            {{- if .Values.secret.betterAuthSecret }}
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: BETTER_AUTH_SECRET
            {{- end }}
            {{- if .Values.secret.aliyunOssSignedUrlExpiresSeconds }}
            - name: ALIYUN_OSS_SIGNED_URL_EXPIRES_SECONDS
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: ALIYUN_OSS_SIGNED_URL_EXPIRES_SECONDS
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /app/backend/config.yaml
              subPath: config.yaml
            - name: config
              mountPath: /app/backend/extensions_config.json
              subPath: extensions_config.json
            - name: data
              mountPath: /app/backend/.deer-flow
            {{- if .Values.persistence.skills.enabled }}
            - name: skills
              mountPath: {{ .Values.persistence.skills.mountPath }}
            {{- end }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.langgraph.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.langgraph.containerSecurityContext | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        {{- if .Values.persistence.data.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        {{- else }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- if .Values.persistence.skills.enabled }}
        - name: skills
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-skills
        {{- end }}
{{- with .Values.langgraph.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.langgraph.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.langgraph.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
{{- end }}
