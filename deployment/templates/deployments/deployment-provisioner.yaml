{{- if .Values.provisioner.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-provisioner
  labels:
    {{- include "deer-flow.labels" . | nindent 4 }}
    app.kubernetes.io/component: provisioner
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: {{ .Values.provisioner.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "deer-flow.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: provisioner
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "deer-flow.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: provisioner
    spec:
      {{- include "deer-flow.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ .Release.Name }}-provisioner
      containers:
        - name: provisioner
          image: "{{ .Values.provisioner.image.repository }}:{{ .Values.provisioner.image.tag }}"
          imagePullPolicy: {{ .Values.provisioner.image.pullPolicy }}
          command: ["sh", "-c", "uvicorn app:app --host 0.0.0.0 --port 8002"]
          ports:
            - name: http
              containerPort: 8002
              protocol: TCP
          env:
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SANDBOX_IMAGE
              value: {{ .Values.provisioner.sandboxImage | quote }}
            - name: SANDBOX_PORT
              value: {{ .Values.provisioner.sandboxPort | quote }}
            - name: DEER_FLOW_SANDBOX_PROVISIONER_URL
              value: "http://{{ .Release.Name }}-provisioner:8002"
          resources:
            {{- toYaml .Values.provisioner.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.provisioner.containerSecurityContext | nindent 12 }}
{{- with .Values.provisioner.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.provisioner.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.provisioner.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
{{- end }}
{{- end }}
