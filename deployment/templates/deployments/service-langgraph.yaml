apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-langgraph
  labels:
    app.kubernetes.io/name: {{ include "deer-flow.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: langgraph
spec:
  type: ClusterIP
  ports:
    - port: 2024
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "deer-flow.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: langgraph
