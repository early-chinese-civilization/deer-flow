# DeerFlow Server Deployment
# Usage: docker compose -f docker-compose-server.yaml up -d
#
# Services:
#   - postgres: PostgreSQL database (port 15432)
#   - nginx: Reverse proxy (port 18226) with /deer-flow sub-path
#   - frontend: Next.js production server (port 3000)
#   - gateway: Backend Gateway API with embedded LangGraph (port 8001)
#
# Access: http://<server-ip>/deer-flow (via host openresty proxy)
#
# Required env vars (set in .env or environment):
#   BETTER_AUTH_SECRET — required for frontend auth/session security
#   DEER_FLOW_ROOT — project root on host
#
# Host openresty/nginx must proxy /deer-flow to http://127.0.0.1:18226

services:
  # ── PostgreSQL Database ─────────────────────────────────────────────────
  postgres:
    image: postgres:${PG_VERSION:-16}-alpine
    container_name: ecc-deerflow-postgres
    environment:
      - POSTGRES_USER=${PG_USER:-deerflow}
      - POSTGRES_PASSWORD=${PG_PASSWORD:-123456}
      - POSTGRES_DB=${PG_DB:-flow}
    ports:
      - "15432:5432"
    volumes:
      - server-pgdata:/var/lib/postgresql/data
    networks:
      - deer-flow-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-deerflow} -d ${PG_DB:-flow}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx-server
      dockerfile: Dockerfile
    image: server-nginx:latest
    container_name: ecc-deerflow-nginx
    ports:
      - "18226:18226"
    depends_on:
      frontend:
        condition: service_started
      gateway:
        condition: service_healthy
    networks:
      - deer-flow-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18226/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── Frontend - Next.js Production ───────────────────────────────────────
  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
        NEXT_PUBLIC_BASE_PATH: /deer-flow
        NEXT_PUBLIC_BACKEND_BASE_URL: /deer-flow
        NEXT_PUBLIC_LANGGRAPH_BASE_URL: /deer-flow/api/langgraph
    container_name: ecc-deerflow-frontend
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - DEER_FLOW_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
      - DEER_FLOW_INTERNAL_LANGGRAPH_BASE_URL=http://gateway:8001
    env_file:
      - ../frontend/.env
    networks:
      - deer-flow-server
    restart: unless-stopped

  # ── Backend - Gateway API (with embedded LangGraph) ─────────────────────
  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
    container_name: ecc-deerflow-gateway
    command: sh -c "cd backend && PYTHONPATH=. uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --workers 2"
    volumes:
      - ../config.yaml:/app/config.yaml:ro
      - ../extensions_config.json:/app/extensions_config.json:ro
      - ../skills:/app/skills:ro
      - ${DEER_FLOW_ROOT:?DEER_FLOW_ROOT must be set}/backend/.deer-flow:/app/backend/.deer-flow
      # DooD: sandbox uses host Docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      # CLI auth directories for auto-auth (Claude Code + Codex CLI)
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${HOME:?HOME must be set}/.codex
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: true
    working_dir: /app
    environment:
      - CI=true
      - DEER_FLOW_HOME=/app/backend/.deer-flow
      - DEER_FLOW_CHANNELS_LANGGRAPH_URL=http://gateway:8001
      - DEER_FLOW_CHANNELS_GATEWAY_URL=http://gateway:8001
      - DEER_FLOW_HOST_BASE_DIR=${DEER_FLOW_ROOT}/backend/.deer-flow
      - DEER_FLOW_HOST_SKILLS_PATH=${DEER_FLOW_ROOT}/skills
      - DEER_FLOW_SANDBOX_HOST=host.docker.internal
      - DATABASE_URL=postgresql://${PG_USER:-deerflow}:${PG_PASSWORD:-123456}@postgres:5432/${PG_DB:-flow}
      - DEER_FLOW_CHECKPOINTER_DATABASE_URL=postgresql://${PG_USER:-deerflow}:${PG_PASSWORD:-123456}@postgres:5432/check_point
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  server-pgdata:

networks:
  deer-flow-server:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.202.0/24
