# DeerFlow Development Environment
# Usage: docker-compose -f docker-compose-dev.yaml up --build
#
# Services:
#   - nginx: Reverse proxy (port 2026)
#   - frontend: Frontend Next.js dev server (port 3000)
#   - gateway: Backend Gateway API (port 8001)
#   - langgraph: LangGraph server (port 2024)
#   - provisioner (optional): Sandbox provisioner (creates Pods in host Kubernetes)
#
# Prerequisites:
#   - Kubernetes cluster + kubeconfig are only required when using provisioner mode.
#
# Access: http://localhost:2026

services:
  # ── Sandbox Provisioner ────────────────────────────────────────────────
  # Manages per-sandbox Pod + Service lifecycle in the host Kubernetes
  # cluster via the K8s API.
  # Backend accesses sandboxes directly via host.docker.internal:{NodePort}.
  provisioner:
    profiles:
      - provisioner
    build:
      context: ./provisioner
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-}
    container_name: deer-flow-provisioner
    ports:
      - "8002:8002"
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
      # Keep the dev provisioner aligned with the working tree even when a
      # rebuild cannot fetch the base image.
      - ./provisioner/app.py:/app/app.py:ro
    environment:
      - K8S_NAMESPACE=deer-flow
      - SANDBOX_IMAGE=${DEER_FLOW_SANDBOX_IMAGE:-enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest}
      # Current remote sandbox mode defers workspace/skills mounts until after
      # the Pod is ready; the backend initializes them through the OSS config in
      # config.yaml. Do not pass legacy hostPath mount variables here.
      - KUBECONFIG_PATH=/root/.kube/config
      - NODE_HOST=${DEER_FLOW_SANDBOX_NODE_HOST:-host.docker.internal}
      # Set K8S_API_SERVER in ../.env when the kubeconfig server uses
      # 127.0.0.1/localhost, which is unreachable from inside the container.
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow-dev
      - deer-flow-k8s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ── Reverse Proxy ──────────────────────────────────────────────────────
  # Routes API traffic to gateway/langgraph and (optionally) provisioner.
  # Select nginx config via NGINX_CONF:
  # - nginx.local.conf (default): no provisioner route (local/aio modes)
  # - nginx.conf: includes provisioner route (provisioner mode)
  nginx:
    image: nginx:alpine
    container_name: deer-flow-nginx
    ports:
      - "2026:2026"
    volumes:
      - ./nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - gateway
      - langgraph
    networks:
      - deer-flow-dev
    restart: unless-stopped

  # Frontend - Next.js Development Server
  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: dev
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    container_name: deer-flow-frontend
    command: sh -c "cd frontend && pnpm run dev > /app/logs/frontend.log 2>&1"
    volumes:
      - ../frontend/src:/app/frontend/src
      - ../frontend/public:/app/frontend/public
      - ../frontend/next.config.js:/app/frontend/next.config.js:ro
      - ../logs:/app/logs
      # Mount pnpm store for caching
      - ${PNPM_STORE_PATH:-~/.local/share/pnpm/store}:/root/.local/share/pnpm/store
    working_dir: /app
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CI=true
      - DEER_FLOW_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
      - DEER_FLOW_INTERNAL_LANGGRAPH_BASE_URL=http://langgraph:2024
    env_file:
      - ../frontend/.env
    networks:
      - deer-flow-dev
    restart: unless-stopped

  # Backend - Gateway API
  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      # cache_from disabled - requires manual setup: mkdir -p /tmp/docker-cache-gateway
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
    container_name: deer-flow-gateway
    command:
      - /usr/local/bin/deer-flow-mount-ossfs2-workspaces.sh
      - sh
      - -c
      - cd backend && uv sync && PYTHONPATH=. uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --reload --reload-include='*.yaml .env' > /app/logs/gateway.log 2>&1
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - ../backend/:/app/backend/
      - ../backend/.deer-flow:/app/backend/.deer-flow
      # Preserve the .venv built during Docker image build — mounting the full backend/
      # directory above would otherwise shadow it with the (empty) host directory.
      - gateway-venv:/app/backend/.venv
      - ../config.yaml:/app/config.yaml
      - ../logs:/app/logs
      # Mount uv cache for faster dependency installation
      - ~/.cache/uv:/root/.cache/uv
      # DooD: same as gateway — AioSandboxProvider runs inside LangGraph process.
      - /var/run/docker.sock:/var/run/docker.sock
      # CLI auth directories for auto-auth (Claude Code + Codex CLI)
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${HOME:?HOME must be set}/.codex
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: true
    working_dir: /app
    environment:
      - CI=true
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql://deerflow:123456@host.docker.internal:5432/flow}
      - DEER_FLOW_CHECKPOINTER_DATABASE_URL=${DOCKER_CHECKPOINTER_DATABASE_URL:-postgresql://deerflow:123456@host.docker.internal:5432/check_point}
      - DEER_FLOW_HOME=/app/backend/.deer-flow
      - DEER_FLOW_SHARED_FS_ROOT=/app/backend/.deer-flow
      - DEER_FLOW_HOST_SHARED_FS_ROOT=${DEER_FLOW_ROOT}/backend/.deer-flow
      - DEER_FLOW_CHANNELS_LANGGRAPH_URL=${DEER_FLOW_CHANNELS_LANGGRAPH_URL:-http://langgraph:2024}
      - DEER_FLOW_CHANNELS_GATEWAY_URL=${DEER_FLOW_CHANNELS_GATEWAY_URL:-http://gateway:8001}
      - DEER_FLOW_SANDBOX_PROVISIONER_URL=http://provisioner:8002
      - DEER_FLOW_HOST_BASE_DIR=${DEER_FLOW_ROOT}/backend/.deer-flow
      - DEER_FLOW_HOST_SKILLS_PATH=${DEER_FLOW_ROOT}/backend/.deer-flow/skills
      - DEER_FLOW_SANDBOX_HOST=host.docker.internal
      - DEER_FLOW_OSSFS2_WORKSPACES_MOUNT=${DEER_FLOW_OSSFS2_WORKSPACES_MOUNT:-true}
      - DEER_FLOW_OSSFS2_WORKSPACES_MOUNT_POINT=/app/backend/.deer-flow/workspaces
      - DEER_FLOW_OSSFS2_WORKSPACES_PREFIX=${DEER_FLOW_OSSFS2_WORKSPACES_PREFIX:-workspaces/}
    env_file:
      - ../.env
    extra_hosts:
      # For Linux: map host.docker.internal to host gateway
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow-dev
      - deer-flow-k8s
    restart: unless-stopped

  # Backend - LangGraph Server
  langgraph:
    build:
      context: ../
      dockerfile: backend/Dockerfile
      # cache_from disabled - requires manual setup: mkdir -p /tmp/docker-cache-langgraph
      args:
        APT_MIRROR: ${APT_MIRROR:-}
        UV_IMAGE: ${UV_IMAGE:-ghcr.io/astral-sh/uv:0.7.20}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://pypi.org/simple}
    container_name: deer-flow-langgraph
    command:
      - /usr/local/bin/deer-flow-mount-ossfs2-workspaces.sh
      - sh
      - -c
      - cd backend && uv sync && uv run langgraph dev --no-browser --allow-blocking --host 0.0.0.0 --port 2024 --n-jobs-per-worker 10 > /app/logs/langgraph.log 2>&1
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - ../backend/:/app/backend/
      # Preserve the .venv built during Docker image build — mounting the full backend/
      # directory above would otherwise shadow it with the (empty) host directory.
      - langgraph-venv:/app/backend/.venv
      - ../config.yaml:/app/config.yaml
      - ../extensions_config.json:/app/extensions_config.json
      - ../skills:/app/skills
      - ../logs:/app/logs
      # Mount uv cache for faster dependency installation
      - ~/.cache/uv:/root/.cache/uv
      # DooD: same as gateway — AioSandboxProvider runs inside LangGraph process.
      - /var/run/docker.sock:/var/run/docker.sock
      # CLI auth directories for auto-auth (Claude Code + Codex CLI)
      - type: bind
        source: ${HOME:?HOME must be set}/.claude
        target: /root/.claude
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: ${HOME:?HOME must be set}/.codex
        target: /root/.codex
        read_only: true
        bind:
          create_host_path: true
    working_dir: /app
    environment:
      - CI=true
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql://deerflow:123456@host.docker.internal:5432/flow}
      - DEER_FLOW_CHECKPOINTER_DATABASE_URL=${DOCKER_CHECKPOINTER_DATABASE_URL:-postgresql://deerflow:123456@host.docker.internal:5432/check_point}
      - DEER_FLOW_HOME=/app/backend/.deer-flow
      - DEER_FLOW_SHARED_FS_ROOT=/app/backend/.deer-flow
      - DEER_FLOW_HOST_SHARED_FS_ROOT=${DEER_FLOW_ROOT}/backend/.deer-flow
      - DEER_FLOW_SANDBOX_PROVISIONER_URL=http://provisioner:8002
      - DEER_FLOW_HOST_BASE_DIR=${DEER_FLOW_ROOT}/backend/.deer-flow
      - DEER_FLOW_HOST_SKILLS_PATH=${DEER_FLOW_ROOT}/backend/.deer-flow/skills
      - DEER_FLOW_SANDBOX_HOST=host.docker.internal
      - DEER_FLOW_OSSFS2_WORKSPACES_MOUNT=${DEER_FLOW_OSSFS2_WORKSPACES_MOUNT:-true}
      - DEER_FLOW_OSSFS2_WORKSPACES_MOUNT_POINT=/app/backend/.deer-flow/workspaces
      - DEER_FLOW_OSSFS2_WORKSPACES_PREFIX=${DEER_FLOW_OSSFS2_WORKSPACES_PREFIX:-workspaces/}
    env_file:
      - ../.env
    extra_hosts:
      # For Linux: map host.docker.internal to host gateway
      - "host.docker.internal:host-gateway"
    networks:
      - deer-flow-dev
      - deer-flow-k8s
    restart: unless-stopped

volumes:
  # Persist .venv across container restarts so dependencies installed during
  # image build are not shadowed by the host backend/ directory mount.
  gateway-venv:
  langgraph-venv:

networks:
  deer-flow-dev:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.200.0/24
  deer-flow-k8s:
    external: true
    name: ${DEER_FLOW_K8S_DOCKER_NETWORK:-kind}
