name: CD to Yanhuang Cluster

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/k8s_ops

env:
  REGISTRY: novainspire-acr-registry.cn-wulanchabu.cr.aliyuncs.com
  IMAGE_PREFIX: sais/bio

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ecc-agent-server
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platform: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/deer-flow-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/deer-flow-backend:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platform: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/deer-flow-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/deer-flow-frontend:latest

      - name: Build and push Provisioner
        uses: docker/build-push-action@v5
        with:
          context: ./docker/provisioner
          file: ./docker/provisioner/Dockerfile
          push: true
          platform: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/deer-flow-provisioner:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/deer-flow-provisioner:latest

  deploy:
    needs: build-and-push
    runs-on: ecc-agent-server
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platform: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/deer-flow-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/deer-flow-backend:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platform: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/deer-flow-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/deer-flow-frontend:latest

      - name: Build and push Provisioner
        uses: docker/build-push-action@v5
        with:
          context: ./docker/provisioner
          file: ./docker/provisioner/Dockerfile
          push: true
          platform: linux/amd64
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/deer-flow-provisioner:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/deer-flow-provisioner:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          echo "KUBECONFIG=/tmp/kubeconfig" >> $GITHUB_ENV

      - name: Validate Helm manifest
        run: helm template ecc-yanhuang ./deployment \
          -f ./values.production.yaml \
          --set image.tag=${{ github.sha }} \
          --set frontendImage.tag=${{ github.sha }} \
          --set provisioner.image.tag=${{ github.sha }} \
          --namespace bio-dev > /dev/null

      - name: Deploy with Helm
        run: |
          helm upgrade --install ecc-yanhuang ./deployment \
            -f ./values.production.yaml \
            --set image.tag=${{ github.sha }} \
            --set frontendImage.tag=${{ github.sha }} \
            --set provisioner.image.tag=${{ github.sha }} \
            --namespace bio-dev \
            --timeout 300s

      - name: Verify deployment
        run: kubectl rollout status deployment -n bio-dev
